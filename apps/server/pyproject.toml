[project]
name = "cocktail-server"
version = "0.0.0"
description = "Cocktail の FastAPI サーバ（Gemma + Anima）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pillow>=10.4",
    "torch>=2.8",
    # diffusers の Cosmos/Anima DiT は concat_padding_mask 経路で torchvision.transforms を使う
    "torchvision>=0.21",
    "transformers>=4.51",
    "accelerate>=1.0",
    # LLM(日本語→画像プロンプト JSON)は llama.cpp(GGUF)で動かす。Blackwell(sm_120)では
    # PyPI/事前ビルド wheel の CUDA カーネルが動かないため、CUDA 有効でソースビルドが要る:
    #   CMAKE_ARGS="-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=120" uv sync
    # ランタイムの CUDA ライブラリ(cudart/cublas)は torch 同梱のものを RTLD で先読みする。
    "llama-cpp-python>=0.3.0",
    # Anima 単体チェックポイントを変換ロードするため safetensors を直接利用
    "safetensors>=0.4",
    # Anima は公式 diffusers に modular pipeline として入ったが未リリースのため
    # git から取得する（コミット固定は [tool.uv.sources] を参照）
    "diffusers",
    # Turbo LoRA を PEFT アダプタとして注入する diffusers の load_lora_weights 経路に必須。
    "peft>=0.13",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "python-multipart>=0.0.18",
    "json-repair>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cocktail_server"]

[tool.uv.sources]
# PyTorch は CUDA 対応ビルドを使う（Blackwell RTX 50xx は CUDA 12.8+ 必須）
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# Anima modular pipeline (huggingface/diffusers#13732) は未リリースのため git 固定。
# 兄弟プロジェクト vImagen で実績のある main コミットに合わせて de-risk する。
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "41add3410424cc33d748a7fd3409132d2f6b4ad2" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
